name: Build coopdx-updater

on:
  push:
    branches: [ "core" ]

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: windows-x64

          - os: ubuntu-latest
            rid: linux-x64
            artifact: linux-x64

          - os: macos-15-intel
            rid: osx-x64
            artifact: macos-intel

          - os: macos-latest
            rid: osx-arm64
            artifact: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore coopdx_updater.csproj

      - name: Publish
        run: |
          dotnet publish -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:InvariantGlobalization=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish \
            coopdx_updater.csproj

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/
